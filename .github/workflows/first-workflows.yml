name: first-workflow

on: push

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: get-repo-code
        uses: actions/checkout@v6

      - name: validate html file
        run: test -f index.html

      - name: validate js file
        run: test -f script.js

      - name: validate code
        run: code --check script.js
